plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.discounttracker'
version = '0.0.1'
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'nl.martijndwars:web-push:5.1.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // OfferComparisonTest가 이 표를 읽는다. gradle은 기본적으로 이 파일을 test 입력으로
    // 안 잡아서 표만 고치면 재실행 없이 캐시된 결과를 그대로 낸다 - 그러면 웹과 API가
    // 갈라져도 못 잡는다(ADR-016). api/가 gradle 루트라 rootDir는 api/ 자신이다.
    inputs.file("$rootDir/../docs/contracts/certainty-cases.json")
}
