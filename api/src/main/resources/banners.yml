# 당일 행사·특별 할인 배너. 사람이 직접 적는다.
#
# 원장(export.json)에서 자동 추출하지 않는다 — 여기 띄우는 건 정의상 상시
# 오퍼 목록에 없는 것(앱 전체 이벤트, 첫 주문 쿠폰, 하루짜리 행사)이라
# 오퍼 데이터에 묶으면 정작 띄우고 싶은 것을 못 띄운다.
#
# 고치는 법: 이 파일만 고치고 `POST /api/reload`. 프론트 재배포는 필요 없다.
# 응답의 `bannersOk`가 false면 이 파일이 깨진 것이다 — 그때 `banners` 건수는
# 새로 읽은 값이 아니라 이전 목록 그대로다.
# 서버는 jar 밖 파일을 물려 뜬다(application.yml의 discount.banners-path).
#
# 기간(startsOn ~ endsOn) 밖인 배너는 서버가 안 내려보낸다. 지난 행사는
# 지우지 말고 그냥 둬도 된다 — 다음에 같은 행사를 할 때 날짜만 고치면 된다.
#
#   id        필수, 고유. 브랜드-날짜로 짓는다
#   brand     선택. 생략하면 앱 전체 행사로 그려진다(로고 자리에 앱 아이콘)
#   platform  필수. baemin | coupangeats | ddangyo | yogiyo
#   url       필수. 눌렀을 때 갈 곳. **?가 들어가면 반드시 따옴표로 감싼다** —
#             "https://.../x.html?abc" 처럼. 안 감싸면 파일 전체가 파싱에
#             실패해 새 배너뿐 아니라 기존 배너까지 갱신이 멈춘다
#             (2026-08-22 실측: 하루치 배너가 통째로 안 떴다)
#   amount    필수, 문자열. 배너에서 가장 큰 글씨다. "12,000원", "최대 30%",
#             "첫 주문 5,000원" 전부 가능하지만 길면 좁은 화면에서 옆의
#             기간·부가정보를 밀어낸다
#   period    필수. 금액 우측 상단("8/11 하루만")
#   extra     선택. 금액 우측 하단, 기간보다 작은 글씨. 없으면 그 줄이 사라진다
#   minOrder  선택, 숫자. 최소주문금액. 적어두면 이 배너가 브랜드 카드의
#             오퍼로 설 때 조건으로 함께 들어간다. extra에 "18,000원↑"
#             이라고 적어도 그건 사람이 읽는 문장일 뿐이라, 오퍼 상세는
#             "최소주문 미확인"으로 남는다
#   color     선택. 브랜드색을 직접 지정한다. 없으면 프론트가 로고에서 뽑고,
#             그마저 실패하면 플랫폼 색을 쓴다
#   priority  선택. 낮을수록 먼저. 기본 999
#
# 예시(그대로 두면 기간이 지나 안 뜬다):
#
#   - id: kyochon-20260811
#     brand: 교촌치킨
#     platform: baemin
#     url: https://s.baemin.com/example
#     amount: "12,000원"
#     period: 8/11 하루만
#     extra: "20,000원↑, 선착순 300명"
#     minOrder: 20000
#     startsOn: 2026-08-11
#     endsOn: 2026-08-11
#     priority: 1

banners: []
