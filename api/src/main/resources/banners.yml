# 당일 행사·특별 할인 배너. 사람이 직접 적는다.
#
# 원장(export.json)에서 자동 추출하지 않는다 — 여기 띄우는 건 정의상 상시
# 오퍼 목록에 없는 것(앱 전체 이벤트, 첫 주문 쿠폰, 하루짜리 행사)이라
# 오퍼 데이터에 묶으면 정작 띄우고 싶은 것을 못 띄운다.
#
# 고치는 법: 이 파일만 고치고 `POST /api/reload`. 프론트 재배포는 필요 없다.
# 응답의 `bannersOk`가 false면 이 파일이 깨진 것이다 — 그때 `banners` 건수는
# 새로 읽은 값이 아니라 이전 목록 그대로다.
# 서버는 jar 밖 파일을 물려 뜬다(application.yml의 discount.banners-path).
#
# 기간(startsAt ~ endsAt) 밖인 배너는 서버가 안 내려보낸다. 지난 행사는
# 지우지 말고 그냥 둬도 된다 — 다음에 같은 행사를 할 때 시각만 고치면 된다.
#
# 2026-09-22 배너 모델 재설계로 칸이 바뀌었다. 요약은
# docs/superpowers/reports/2026-09-24-banner-model-summary.md, 확정 규칙은
# docs/superpowers/decisions/2026-09-22-banner-model-rules.md에 있다.
# **배너 하나가 화면(띠)과 오퍼(브랜드 카드) 양쪽으로 나간다.** 그래서 조건을
# 문장이 아니라 칸으로 적어야 비교에 들어간다.
#
#   id        필수, 고유. 브랜드-날짜로 짓는다
#   group     선택. 같은 값을 적은 배너끼리 한 장으로 그린다. 비우면 혼자.
#             묶을지 뗄지는 사람이 정한다 — 조건이 같아도 자동으로 안 묶인다
#   brand     선택. 생략하면 앱 전체 행사로 그려진다(로고 자리에 앱 아이콘)
#   brands    선택. 묶음일 때 쉼표로 여럿. 슬래시 금액과 순서로 짝짓는다
#             (예: 8,000/8,000원이면 두 브랜드)
#   platform  baemin | coupangeats | ddangyo | yogiyo | own. own은 브랜드 자체
#             앱이나 사이트의 행사(앱 배지 없이 브랜드 로고만). 브랜드 카드에
#             오퍼로 서긴 하지만(2026-09-22) 배달앱끼리 겨루는 "최고 할인"
#             자리에는 못 낀다. 비우면 own으로 읽는다. own이면 brand는 필수
#   via       선택. 제휴 결제(naverpay 등). 아이콘만 바뀐다
#   url       필수. 눌렀을 때 갈 곳. **?가 들어가면 반드시 따옴표로 감싼다** —
#             "https://.../x.html?abc" 처럼. 안 감싸면 파일 전체가 파싱에
#             실패해 새 배너뿐 아니라 기존 배너까지 갱신이 멈춘다
#             (2026-08-22 실측: 하루치 배너가 통째로 안 떴다)
#   startsAt  필수. 시각까지 적는다(2026-08-11T00:00). 날짜만 쓰던 startsOn을
#             대신한다 — 마지막 날 포함 여부를 매번 틀리던 문제를 없앴다.
#             시간대는 Asia/Seoul이고 파일에는 시간대 없이 지역 시각으로 적는다
#   endsAt    필수. **마지막 날 끝까지면 `T23:59:59`다.** `T23:59`로 적으면 59초가
#             잘려 옛 날짜 비교와 어긋난다(확정 규칙 2절이 오기로 명시한 자리다)
#   soldOut   선택. true면 기간 내내 이미 다 나간 것으로 본다. 하루짜리가
#             아니면 거의 쓸 일이 없다
#   soldOutOn 선택. YYYY-MM-DD. **그날 하루만** 다 나간 것으로 본다. 선착순은
#             매일 다시 풀리므로 보통 이쪽을 쓴다 — soldOut을 켜 두면 다음 날
#             아침에도 매진으로 떠서, 늦지 않았는데 늦었다고 말한다.
#             배너를 내리지 않고 남기는 이유는 없어진 것과 다 나간 것이 다른
#             소식이기 때문이다. "오늘은 늦었다"를 알아야 내일 일찍 온다
#   color     선택. 브랜드색을 직접 지정한다. 없으면 프론트가 로고에서 뽑고,
#             그마저 실패하면 플랫폼 색을 쓴다
#   priority  선택. 낮을수록 먼저. 기본 999
#   notify    선택. 기본 false. 신규 등록 또는 false에서 true로 바뀔 때 알림 대상
#   notifyImmediately 선택. 기본 false. 07:00 이상 22:00 미만에만 즉시 발송
#
#   ── 무엇을 얼마나 ──
#   amount    필수. **금액이면 구조로 적는다.** 그래야 오퍼 비교에 들어간다:
#               {won: 8000}                        8,000원 할인
#               {won: [null, 8000]}                최대 8,000원(하한 모름)
#               {won: [1000, 8000], random: true}  1,000~8,000원 뽑기
#               {percent: 30}                      30% 할인
#               {percent: 50, kind: cashback}      50% 캐시백
#             won과 percent는 하나만 쓴다. kind는 discount(기본) | cashback |
#             points. **적립은 limit이 아니라 kind다.** percent(정률)는 platform이
#             own일 때만 오퍼로 선다 — 배달앱 정률은 화면에 그릴 자리가 아직
#             없어 레일에만 뜬다(2026-09-22).
#             구조로 적으면 화면 문구(금액·기간·부가조건)는 서버가 만든다.
#
#             **금액이 아닌 혜택은 문자열로 적는다** — "디카페인 메뉴 1+1"처럼
#             won/percent로 표현할 수 없는 것. 그때는 period와 extra도 직접
#             적는다(서버가 만들 근거가 없다). 문자열은 배너 띠에만 뜨고
#             오퍼 비교에는 안 들어간다
#   period    문자열 amount일 때. 금액 우측 상단("8/11 하루만")
#   extra     문자열 amount일 때, 선택. 금액 우측 하단. 없으면 그 줄이 사라진다
#   minOrder  선택, 숫자. 최소주문금액. 이 배너가 오퍼로 설 때 조건으로 들어간다.
#             extra에 "18,000원↑"이라고만 적으면 서버가 되짚어 읽기는 하지만
#             (effectiveMinOrder) 이 칸에 숫자로 적는 쪽이 확실하다
#
#   ── 누가 받나 (자격) ──
#   membership  선택. 플랫폼 멤버십 키(coupangEats, baeminClub …)
#   channel     선택. 배달 | 포장
#   targeted    선택. true면 타겟딜(개인 지정), false면 누구나
#
#   ── 몇 명까지 (한도) ──
#   firstCome   선택. issue(발급 선착순) | use(사용 선착순). 옛 limit/usage를 대신한다
#   untilSoldOut 선택. true면 "소진될 때까지 유효"다. **soldOut과 뜻이 반대다** —
#               soldOut은 "이미 다 나갔다"이고 이것은 "다 나갈 때까지는 된다"다.
#               서로 대응시키지 않는다(확정 규칙 2절)
#   opensAt     선택. "HH:MM" 매일 여는 시각. 하루짜리 행사는 startsAt에 적는다
#
#   ── 사람이 읽는 것 ──
#   event     선택. 짧은 행사 제목(더블 땡데이, 위클리 슈퍼딜)
#   note      선택. 위 칸 어디에도 안 담기는 한 줄. **"선착순 300명"처럼 새 칸에
#             담을 자리가 아예 없는 정보가 여기로 온다**(확정 규칙 8절)
#
# 옛 모양 — **읽히기는 하지만 새로 적을 때는 쓰지 않는다.**
#   startsOn / endsOn  날짜만. `startsOn: D`는 `D T00:00`, `endsOn: D`는
#                      `D T23:59:59`로 읽힌다. startsAt/endsAt(시각)으로 적는다
#   items              [{brand, amount, minOrder, opensAt}] → brands와 group으로 적는다
#   amountRange        [최소, 최대] → amount: {won: [최소, 최대]}로 적는다
#   limit              first_come|random|targeted|none → firstCome / targeted /
#                      amount.random / amount.kind로 쪼개졌다
#   usage              use|issue → firstCome에 그 값을 적는다
#
# BannerCatalog.toBanner가 두 모양을 매번 나눠 읽는다. 이 읽기를 지울 수 있는 때는
# 라이브 banners.yml에 옛 모양이 0건일 때다(RULES 9·11). 만료된 배너라도 다시
# 읽혀야 하므로 그 전에는 못 지운다. 몇 장 남았는지는 이렇게 센다:
#
#   python tools/convert_banners.py --file <banners.yml>     (beggars-ops)
#
# 2026-09-28 실측: 150장 중 새 기간(startsAt) 16장, 구조 amount 13장. 나머지는 옛 모양이다.
#
# 확실성(certainty)은 적는 칸이 아니라 위 칸에서 서버가 정한다 — exact, capped,
# random, menuOnly, percent 다섯이고, "최고 할인" 후보는 exact인 것만이다.
# 판정표는 src/test/resources/contracts/certainty-cases.json 한 곳에 있다.
#
# 예시(그대로 두면 기간이 지나 안 뜬다):
#
#   - id: kyochon-20260811
#     brand: 교촌치킨
#     platform: baemin
#     url: https://s.baemin.com/example
#     amount: {won: 12000}
#     minOrder: 20000
#     firstCome: issue
#     startsAt: 2026-08-11T00:00
#     endsAt: 2026-08-11T23:59:59
#     priority: 1

banners: []
