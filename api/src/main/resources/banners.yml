# 당일 행사·특별 할인 배너. 사람이 직접 적는다.
#
# 원장(export.json)에서 자동 추출하지 않는다 — 여기 띄우는 건 정의상 상시
# 오퍼 목록에 없는 것(앱 전체 이벤트, 첫 주문 쿠폰, 하루짜리 행사)이라
# 오퍼 데이터에 묶으면 정작 띄우고 싶은 것을 못 띄운다.
#
# 고치는 법: 이 파일만 고치고 `POST /api/reload`. 프론트 재배포는 필요 없다.
# 응답의 `bannersOk`가 false면 이 파일이 깨진 것이다 — 그때 `banners` 건수는
# 새로 읽은 값이 아니라 이전 목록 그대로다.
# 서버는 jar 밖 파일을 물려 뜬다(application.yml의 discount.banners-path).
#
# 기간(startsOn ~ endsOn) 밖인 배너는 서버가 안 내려보낸다. 지난 행사는
# 지우지 말고 그냥 둬도 된다 — 다음에 같은 행사를 할 때 날짜만 고치면 된다.
#
#   id        필수, 고유. 브랜드-날짜로 짓는다
#   brand     선택. 생략하면 앱 전체 행사로 그려진다(로고 자리에 앱 아이콘)
#   platform  baemin | coupangeats | ddangyo | yogiyo | own. own은 브랜드 자체
#             앱이나 사이트의 행사(앱 배지 없이 브랜드 로고만). 브랜드 카드에
#             오퍼로 서긴 하지만(2026-09-22) 배달앱끼리 겨루는 "최고 할인"
#             자리에는 못 낀다. 비우면 own으로 읽는다. own이면 brand는 필수
#   url       필수. 눌렀을 때 갈 곳. **?가 들어가면 반드시 따옴표로 감싼다** —
#             "https://.../x.html?abc" 처럼. 안 감싸면 파일 전체가 파싱에
#             실패해 새 배너뿐 아니라 기존 배너까지 갱신이 멈춘다
#             (2026-08-22 실측: 하루치 배너가 통째로 안 떴다)
#   amount    필수. 문자열이거나 구조 칸(아래) 중 하나. 문자열이면 배너에서
#             가장 큰 글씨로만 뜬다 — "12,000원", "최대 30%", "첫 주문
#             5,000원" 전부 가능하지만 길면 좁은 화면에서 옆의 기간·부가정보를
#             밀어낸다. **브랜드 카드의 오퍼로 서려면 구조 칸(amount.won)이
#             있어야 한다 — 문자열만 적으면 레일에는 뜨지만 오퍼 비교에는 안
#             들어간다(2026-09-22, 문장을 서버가 다시 안 읽는다). amount.percent
#             (정률)는 platform이 own일 때만 오퍼로 선다 — 배달앱 정률은 화면에
#             그릴 자리가 아직 없어 레일에만 뜬다(2026-09-22)**
#   period    필수. 금액 우측 상단("8/11 하루만")
#   extra     선택. 금액 우측 하단, 기간보다 작은 글씨. 없으면 그 줄이 사라진다
#   minOrder  선택, 숫자. 최소주문금액. 적어두면 이 배너가 브랜드 카드의
#             오퍼로 설 때 조건으로 함께 들어간다. extra에 "18,000원↑"
#             이라고 적어도 그건 사람이 읽는 문장일 뿐이라, 오퍼 상세는
#             "최소주문 미확인"으로 남는다
#   color     선택. 브랜드색을 직접 지정한다. 없으면 프론트가 로고에서 뽑고,
#             그마저 실패하면 플랫폼 색을 쓴다
#   priority  선택. 낮을수록 먼저. 기본 999
#   notify    선택. 기본 false. 신규 등록 또는 false에서 true로 바뀔 때 알림 대상
#   notifyImmediately 선택. 기본 false. 07:00 이상 22:00 미만에만 즉시 발송
#
#   구조 필드(2026-09-18, 설계 25). amount·period·extra를 비우고 이것만 적으면 서버가
#   문구를 만든다. 문장 칸이 적혀 있으면 그 문장이 이긴다.
#   items       [{brand, amount, minOrder, opensAt: "HH:MM"}] 브랜드별 값. brands와
#               amount, minOrder(전부 같을 때)는 여기서 나온다
#   amountRange [최소, 최대] 랜덤 쿠폰. 최소는 모르면 null. "최대 8,000원"
#   opensAt     "HH:MM" 매일 여는 시각(브랜드마다 다르면 items에)
#   limit       first_come | random | targeted | none
#   usage       use(사용 선착순) | issue(발급 선착순). limit이 first_come일 때
#   channel     배달 | 포장
#   membership  플랫폼 멤버십 키(coupangEats 등)
#   event       짧은 행사 제목(뚜쥬데이, 위클리 슈퍼딜)
#   note        위 칸에 안 담기는 한 줄
#
# 예시(그대로 두면 기간이 지나 안 뜬다):
#
#   - id: kyochon-20260811
#     brand: 교촌치킨
#     platform: baemin
#     url: https://s.baemin.com/example
#     amount: "12,000원"
#     period: 8/11 하루만
#     extra: "20,000원↑, 선착순 300명"
#     minOrder: 20000
#     startsOn: 2026-08-11
#     endsOn: 2026-08-11
#     priority: 1

banners: []
