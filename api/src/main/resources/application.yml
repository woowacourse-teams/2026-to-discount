# classpath 쪽 export.json은 실데이터가 아니라 **스키마 샘플 픽스처**다.
# rawText가 전부 "[샘플]"로 시작하고 브랜드도 몇 개뿐이라, 화면에 그게
# 보이면 실데이터를 안 읽고 있다는 신호다.
#
# 실제 데이터를 보려면 DISCOUNT_EXPORT_PATH로 실파일을 가리켜야 한다.
# 서버(systemd)가 그렇게 띄운다:
#   DISCOUNT_EXPORT_PATH=file:<서버>/delivery-discount-api/data/export.json
# 로컬에서 export.json을 고쳐도 안 보이던 건 이 기본값 때문이었다
# (2026-08-03 실측). ADR-001 참고.
#
# banners.yml도 같은 이유로 경로를 열어둔다. 배너는 매일 바뀔 수 있는
# 내용이라 classpath 안에만 두면 행사 하나 바꾸는 데 jar를 다시 빌드해야
# 한다. jar 밖 파일을 물려두면 파일만 갈아끼우고 POST /api/reload로
# 반영된다. 기본값(classpath)은 빈 목록이라 배너가 아예 안 뜬다.
discount:
  cors:
    development-origin: ${DISCOUNT_CORS_DEVELOPMENT_ORIGIN:}
  export-path: ${DISCOUNT_EXPORT_PATH:classpath:data/export.json}
  history-path: ${DISCOUNT_HISTORY_PATH:classpath:data/history.json}
  banners-path: ${DISCOUNT_BANNERS_PATH:classpath:banners.yml}
  # 브랜드 목록. jar 안에 있어 바꾸려면 API를 다시 배포한다(reload로는 안 바뀐다).
  brands-path: ${DISCOUNT_BRANDS_PATH:classpath:brands.yml}
  # 방문 이벤트 원장(append). 설문 판정과 인기가 이 파일에서 새로 붙은 줄만 읽는다.
  event-log-path: ${DISCOUNT_EVENT_LOG_PATH:data/events.jsonl}
  # 브랜드 링크(brands.yml links.<앱>)가 없으면 그 앱 오퍼를 숨긴다. 요기요는 링크 없이 누르면 앱만 켜진다.
  hide-unlinked-platforms: ${DISCOUNT_HIDE_UNLINKED_PLATFORMS:yogiyo}
  # 기프티콘 코드. 값을 가진 문자열이라 저장소에 안 두고 서버에 직접 올린다.
  # 파일이 없으면 남은 코드 0으로 보고 설문이 저절로 안 뜬다.
  gifticons-path: ${DISCOUNT_GIFTICONS_PATH:data/gifticons.yml}
  survey:
    # 접속일·전환수를 건너뛰고 설문 대상으로 볼 visitorId(콤마로 구분).
    # 배포한 화면에서 개발자가 눈으로 확인할 때만 쓴다. 비어 있으면
    # 아무에게도 안 열린다. 1인 1회와 재고는 그대로 걸린다.
    test-visitors: ${DISCOUNT_SURVEY_TEST_VISITORS:}
    # 원장 조사에서 자동화·중복 응답으로 의심되는 visitorId(콤마로 구분).
    # 응답은 그대로 받되(원장엔 남는다) 코드는 안 준다 — 재고 없음과
    # 같은 화면을 본다. 2026-09-02: 하루 만에 322회 전환한 visitorId를
    # 사람이 직접 판단해 여기 넣었다(자동 판정 아님).
    blocked-visitors: ${DISCOUNT_SURVEY_BLOCKED_VISITORS:}
  # 잘못된 정보 제보(POST /api/reports)를 보낼 슬랙. 비어 있으면 로그에만 남긴다.
  report:
    # 받은 제보 원장(append, 한 줄에 JSON 하나). 슬랙과 상관없이 먼저 여기에 적는다.
    # 비우면 이벤트 원장(event-log-path) 옆 reports.jsonl.
    path: ${DISCOUNT_REPORT_PATH:}
    slack-token: ${SLACK_REPORT_TOKEN:}
    slack-channel: ${SLACK_REPORT_CHANNEL:}
  posthog:
    enabled: ${DISCOUNT_POSTHOG_ENABLED:false}
    project-token: ${POSTHOG_PROJECT_TOKEN:}
    host: ${POSTHOG_HOST:https://us.i.posthog.com}
    outbox-path: ${DISCOUNT_POSTHOG_OUTBOX_PATH:}
  push:
    enabled: ${DISCOUNT_PUSH_ENABLED:false}
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:admin@bebeggars.duckdns.org}
    state-path: ${DISCOUNT_PUSH_STATE_PATH:}
    frontend-root: ${DISCOUNT_FRONTEND_ROOT:https://beggars-five.vercel.app/}
    api-root: ${DISCOUNT_API_ROOT:https://bebeggars.duckdns.org}
# Spring Boot 4는 Jackson 3을 쓴다. 3은 기본값이 몇 가지 바뀌었다(속성 알파벳 정렬, 원시 타입에 null 거부 등).
# 응답과 이벤트 원장 모양을 그대로 두려고 2의 기본값으로 맞춘다(2026-10-14 이전).
spring:
  jackson:
    use-jackson2-defaults: true
server:
  port: 8080
  # 개발 부하 실험에서 brands JSON 154KB가 압축 없이 전송됐다.
  # 응답 내용은 유지하고 gzip을 지원하는 클라이언트의 전송량을 줄인다.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  tomcat:
    mbeanregistry:
      enabled: true
logging:
  pattern:
    level: "%5p [request_id=%X{requestId:--}]"

# 외부 API 포트와 분리한다. 같은 서버의 Alloy만 지표를 읽는다.
management:
  server:
    port: ${DISCOUNT_METRICS_PORT:9090}
    address: 127.0.0.1
  # enabled-by-default, endpoint.<id>.enabled는 3.4에서 폐기된 이름이다(4.1로 올리며 2026-10-14 바꿈).
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: prometheus
  endpoint:
    prometheus:
      access: read-only
  metrics:
    distribution:
      # 고정 버킷으로 환경 간 합산 가능한 p95/p99를 계산한다.
      # 자동 히스토그램 버킷과 클라이언트 percentile 시계열은 추가하지 않는다.
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s,10s,30s
