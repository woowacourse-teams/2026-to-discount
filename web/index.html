    <!-- 글자를 쪼개 받는 판(dynamic subset)을 쓴다. 통짜 파일은 한글 전체를
         들고 있어 2.06MB였고, 이 페이지에서 가장 큰 리소스였다(실측
         2026-08-28, LCP 18.8초). 쪼갠 판은 unicode-range로 92조각이라
         화면에 실제로 있는 글자가 든 조각만 받는다 — 조각당 35KB 안팎.

         서체는 그대로다. 굵기도 variable(45~920)이라 앱이 쓰는 400·500·
         600·700·800이 전부 살아 있다. 글자를 덜어낸 것이지 서체를 바꾼
         것이 아니다.

         빌드 시점 텍스트로 직접 서브셋하지 않는 이유: 브랜드가 매일
         바뀌어서 오늘 없는 글자가 내일 들어오면 두부(□)가 뜬다. 이 판은
         어떤 한글이든 어느 조각엔가 들어 있다. -->
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
