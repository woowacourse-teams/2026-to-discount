<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaveEats 배너 (가로형)</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon-48.png" />
  <link rel="stylesheet" href="/fonts/pretendard-block.css" />
  <!-- 부스 배너(1920x1080)를 Google Sites 머리글용 가로형으로 줄인 판. 폭 1920, 높이는 ?h=(기본 600) -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0f1115; }
    body { display: grid; place-items: center; overflow: hidden; font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    .b { --h: 600px; position: relative; width: 1920px; height: var(--h); flex: none; overflow: hidden; background: #f4f7fc; color: #191f28; transform-origin: center; }
    .b__left { position: absolute; left: 130px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; }
    .logo { display: flex; align-items: center; gap: 18px; margin: 0; }
    .logo img { width: calc(var(--h) * .12); height: auto; transform: rotate(-12deg); }
    .logo span { font-size: calc(var(--h) * .11); font-weight: 900; font-style: italic; letter-spacing: -.04em; color: #3182f6; line-height: 1; }
    h1 { margin: calc(var(--h) * .05) 0 0; font-size: calc(var(--h) * .15); font-weight: 900; line-height: 1.12; letter-spacing: -.05em; }
    h1 em { font-style: normal; color: #3182f6; }
    .sub { margin: calc(var(--h) * .05) 0 0; font-size: calc(var(--h) * .048); font-weight: 700; line-height: 1.5; color: #4e5968; letter-spacing: -.02em; }
    .sub b { color: #191f28; font-weight: 800; }
    .side { position: absolute; left: 860px; top: 50%; transform: translateY(-50%); display: grid; gap: 16px; }
    .apps { display: flex; gap: 12px; }
    .apps img { width: calc(var(--h) * .11); height: auto; border-radius: 18px; box-shadow: 0 10px 24px -14px rgba(0,0,0,.45); }
    .qr { display: flex; align-items: center; gap: 18px; padding: 14px 26px 14px 14px; border-radius: 22px; background: #fff; box-shadow: 0 16px 40px -24px rgba(25,31,40,.5); }
    .qr img { width: calc(var(--h) * .13); height: auto; }
    .qr b { display: block; font-size: calc(var(--h) * .048); font-weight: 800; letter-spacing: -.03em; }
    .qr span { font-size: calc(var(--h) * .032); font-weight: 600; color: #6b7684; }
    .b__right { position: absolute; top: 0; right: 0; bottom: 0; width: 600px; background: linear-gradient(150deg, #4a93ff 0%, #3182f6 45%, #1b64da 100%); }
    .ph { position: absolute; width: 260px; height: 560px; border: 11px solid #15161a; border-radius: 42px; background: #fff; overflow: hidden; box-shadow: 0 30px 60px -24px rgba(0,0,0,.5); }
    .ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .ph1 { left: 50px; top: calc(var(--h) * .16); transform: rotate(-7deg); }
    .ph2 { right: 46px; top: calc(var(--h) * .06); transform: rotate(-4deg); }
  </style>
</head>
<body>
  <div class="b" id="b">
    <div class="b__left">
      <p class="logo"><img src="/favicon-192.png" alt="" /><span>SaveEats</span></p>
      <h1>배달앱 할인,<br /><em>한 눈에 보기</em></h1>
      <p class="sub"><b>배민, 쿠팡이츠, 요기요, 땡겨요</b><br />오늘의 할인을 한 화면에서 비교해요</p>
    </div>
    <div class="side">
      <div class="apps"><img src="/platform-icons/baemin.png" alt="배달의민족" /><img src="/platform-icons/coupangeats.png" alt="쿠팡이츠" /><img src="/platform-icons/yogiyo.png" alt="요기요" /><img src="/platform-icons/ddangyo.png" alt="땡겨요" /></div>
      <div class="qr"><img src="/project/qr.svg" alt="서비스 주소 QR" /><div><b>지금 바로 확인</b><span>QR을 스캔하세요</span></div></div>
    </div>
    <div class="b__right">
      <div class="ph ph1"><img src="/about/sheet.jpg" alt="" /></div>
      <div class="ph ph2"><img src="/about/hero.jpg" alt="" /></div>
    </div>
  </div>
  <script>
    var b = document.getElementById('b'), h = +(new URLSearchParams(location.search).get('h') || 600)
    b.style.setProperty('--h', h + 'px')
    var fit = function () { var s = Math.min(innerWidth / 1920, innerHeight / h); b.style.transform = s === 1 ? '' : 'scale(' + s + ')' }
    fit(); addEventListener('resize', fit)
  </script>
</body>
</html>
