name: Deploy Data

# export.json은 캡처 원장(data/*.jsonl, 서버엔 없음 — 캡처는 로컬에서만)의
# 파생 결과라 로컬에서 export_data.py로 만들어 커밋해야 한다. 여기선 그
# 커밋된 파일을 서버 API가 읽는 경로로 옮기고 reload만 호출한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Guard against overwriting newer server data
        # cp는 서버 파일을 통째로 갈아치운다 — 커밋이 서버 실물보다 뒤처져
        # 있으면 푸시 한 번에 서버 쪽 데이터가 사라진다(2026-08-05 실측:
        # 서버 138건 vs 커밋 135건). 낡은 파일이면 여기서 멈춘다.
        #
        # 같은 판정을 하는 check_deploy.py가 있지만(테스트도 거기 붙어 있다)
        # 여기서는 부르지 않는다 — 이 워크플로는 원래 bash와 curl만 쓰고
        # 있었고, 러너에 python이 PATH에 있는지 검증된 적이 없다. 실제로
        # `python check_deploy.py`로 넣었다가 이 스텝에서 배포가 끊겼다
        # (2026-08-05). 판정은 ISO8601 문자열 최대값 비교라 coreutils로
        # 충분하니, 가드가 자기 의존성 때문에 배포를 막는 일이 없게 한다.
        run: |
          SERVER=~/delivery-discount-api/data/export.json
          if [ ! -f "$SERVER" ]; then
            echo "서버에 export.json이 없다 — 첫 배포로 보고 통과"
            exit 0
          fi
          newest() {
            grep -o '"capturedAt"[[:space:]]*:[[:space:]]*"[^"]*"' "$1" \
              | sed 's/.*"\([^"]*\)"$/\1/' | sort | tail -1
          }
          INCOMING=$(newest data/export.json)
          CURRENT=$(newest "$SERVER")
          echo "들어오는 최신 캡처: ${INCOMING:-없음} / 서버: ${CURRENT:-없음}"
          if [ "$INCOMING" \< "$CURRENT" ]; then
            echo "배포 중단: 커밋된 export.json이 서버보다 낡았다."
            echo "서버 쪽 갱신을 원장에 먼저 흡수할 것."
            exit 1
          fi
          # 캡처 시각이 같은데 상세만 사라지는 경우는 위 비교로 못 잡는다 —
          # 2026-08-05에 실제로 그렇게 뚫려 청년피자 땡겨요의 tiers 2건과
          # badge가 날아갔다. 서버에 채워져 있던 값이 비면 막는다.
          # (같은 판정을 하는 check_deploy.py에 테스트가 붙어 있다.)
          if command -v python3 >/dev/null 2>&1; then
            python3 check_deploy.py data/export.json "$SERVER" || exit 1
          else
            echo "python3이 없어 상세 소실 검사를 건너뛴다 — 캡처 시각 검사만 적용됨"
          fi
          echo "배포 안전"

      - name: Deploy export.json to API and reload
        # export.json이 새 필드를 실어 나르면(예: badge, channel), 그 필드를
        # 읽을 API 쪽 코드가 별도 레포·별도 self-hosted 워크플로로 독립
        # 배포되다 보니 이 워크플로가 먼저 끝나 아직 구버전 API가 떠 있는
        # 채로 reload를 부르는 경우가 생긴다 — Jackson이 모르는 필드를
        # 만나 500을 내고(2026-08-03 실측, badge 필드 추가 때 재현) 이
        # 스텝이 exit 22로 실패한다. 데이터 자체는 문제없고 API 쪽 배포가
        # 따라잡을 때까지의 타이밍 문제라 몇 번 재시도로 흡수한다.
        run: |
          cp data/export.json ~/delivery-discount-api/data/export.json
          for i in 1 2 3 4 5; do
            if curl -sf -X POST http://localhost:8088/api/reload; then
              exit 0
            fi
            echo "reload 실패, ${i}번째 재시도 대기..."
            sleep 15
          done
          echo "reload 5회 재시도 후에도 실패"
          exit 1
