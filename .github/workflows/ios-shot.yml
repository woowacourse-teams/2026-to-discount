# 실제 iOS 사파리(시뮬레이터)로 운영 웹을 찍는다. 윈도 웹킷은 iOS 배치 버그를 재현하지 못한다(2026-10-13).
# main 배포(미러) 뒤 자동으로, 또는 Actions에서 주소를 넣어 수동으로 돈다. 결과는 실행의 아티팩트 ios-shots.
# 프리뷰(Vercel 보호)는 저장소 시크릿 VERCEL_BYPASS(Vercel 보호 우회 값)가 있으면 주소에 우회 쿼리를 붙여 연다(2026-10-14).
# 없으면 프리뷰는 로그인 화면이 찍힌다. 시크릿 값은 Actions 로그에서 가려지고, index.txt에는 원래 주소만 적는다.
# local=true면 실행한 브랜치의 web을 러너에서 빌드해 http://localhost:5173 으로 띄워 찍는다(2026-10-15). 프리뷰 보호와
# 상관없이 병합 전에 iOS를 볼 수 있다. 운영 API가 이 출처를 허용한다. 예: gh workflow run ios-shot.yml --ref <브랜치> -f local=true
name: ios-shot
on:
  workflow_dispatch:
    inputs:
      urls: { description: 찍을 주소(공백으로 여럿), default: 'https://beggars-five.vercel.app/?home=a https://beggars-five.vercel.app/?home=old https://beggars-five.vercel.app/about' }
      local: { description: 이 브랜치 web을 러너에서 띄워 찍기(true면 urls의 운영 주소 대신 localhost:5173), default: 'false' }
  workflow_run:
    workflows: [Mirror to deploy repos]
    types: [completed]
    branches: [main]
jobs:
  shot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      URLS: ${{ inputs.local == 'true' && 'http://localhost:5173/?home=a http://localhost:5173/?home=old' || inputs.urls || 'https://beggars-five.vercel.app/?home=a https://beggars-five.vercel.app/?home=old https://beggars-five.vercel.app/about' }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.local == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        if: inputs.local == 'true'
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: 이 브랜치 web 띄우기
        if: inputs.local == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-logo-manifest.mjs
          npx vite build
          nohup npx vite preview --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
      - name: Vercel 배포 기다리기
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: 시뮬레이터 켜기
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')][-1])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl launch "$UDID" com.apple.mobilesafari || true; sleep 20
      - name: 찍기
        env:
          BYPASS: ${{ secrets.VERCEL_BYPASS }}
        run: |
          mkdir shots; n=0
          for u in $URLS; do
            n=$((n+1))
            open="$u"
            case "$u" in *-git-*vercel.app*)
              if [ -n "$BYPASS" ]; then
                sep='?'; case "$u" in *\?*) sep='&';; esac
                open="${u}${sep}x-vercel-protection-bypass=${BYPASS}&x-vercel-set-bypass-cookie=true"
              fi;;
            esac
            xcrun simctl openurl "$UDID" "$open" || { sleep 30; xcrun simctl openurl "$UDID" "$open"; }
            sleep 15
            xcrun simctl io "$UDID" screenshot "shots/$n.png"
            echo "$n $u" >> shots/index.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-shots, path: shots }
