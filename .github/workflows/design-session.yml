# 설계 119 1단계: ready 라벨이 붙으면 설계자 세션을 띄운다.
# 인증은 구독 OAuth 토큰(시크릿 CLAUDE_CODE_OAUTH_TOKEN, 등록 완료). API 키로 바꾸면 이 이름과 입력 이름 두 곳만 고친다.
name: design-session
on:
  issues:
    types: [labeled]

# 같은 이슈에는 한 번에 작업 하나만 돈다.
concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  design:
    if: >-
      github.event.label.name == 'ready' &&
      !contains(github.event.issue.labels.*.name, 'blocked')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # 라벨을 단 사람(sender)의 저장소 권한이 admin/write일 때만 진행한다. 아니면 조용히 종료.
      - name: 라벨 단 사람 권한 확인
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          p=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.sender.login }}/permission" -q .permission)
          echo "권한: $p"
          if [ "$p" = admin ] || [ "$p" = write ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.perm.outputs.ok == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # 외부인 댓글이 세션에 들어가지 않게, 권한 있는 작성자의 댓글만 파일로 만들어 준다.
      - name: 이슈 입력 준비
        if: steps.perm.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          {
            echo "# 이슈 #$ISSUE: $(gh api "repos/${{ github.repository }}/issues/$ISSUE" -q .title)"
            echo
            gh api "repos/${{ github.repository }}/issues/$ISSUE" -q '.body // ""'
            echo
            echo "## 댓글 (OWNER, MEMBER, COLLABORATOR만)"
            gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --paginate \
              | jq -r '.[] | select(.author_association=="OWNER" or .author_association=="MEMBER" or .author_association=="COLLABORATOR") | "### \(.user.login) \(.created_at)\n\(.body)\n"'
          } > "$RUNNER_TEMP/issue-input.md"
      - if: steps.perm.outputs.ok == 'true'
        id: claude
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이슈 #${{ github.event.issue.number }} 의 설계자 세션이다.
            .claude/agents/designer.md 를 먼저 읽고 그 순서와 규칙대로 설계 문서를 쓴다.
            이슈 입력은 ${{ runner.temp }}/issue-input.md 하나만 읽는다. gh issue view로 댓글을 읽지 않는다.
            브랜치는 feat/${{ github.event.issue.number }}-<영문 소문자 3~5단어> 로 만들어 설계 문서를 커밋하고,
            그 브랜치로 초안(draft) PR을 연다. PR 제목과 본문은 .claude/skills/pr-body-ko/SKILL.md 를 읽고 그 형식으로 쓴다.
            끝나면 첫 줄이 `인계:` 인 이슈 댓글 하나를 남긴다.
            셸 명령은 한 번에 하나씩 쓴다. cd, &&, 파이프, heredoc으로 묶지 않는다(허용 목록이 명령 단위라 묶으면 거부된다). 파일은 Write 도구로 쓴다. PR 본문과 댓글은 Write로 파일을 만든 뒤 --body-file로 넘긴다(여러 줄 --body는 거부된다).
            main에는 push할 수 없다(저장소 규칙). feat/ 브랜치에만 push한다.
          # designer.md 의 tools 와 같은 목록. 프롬프트만으로는 도구 제한이 걸리지 않는다.
          # git push 전체를 열어도 main은 저장소 규칙(PR 필수, 관리자 예외)이 막는다.
          claude_args: --max-turns 50 --allowedTools "Read,Grep,Glob,Write,Edit,Bash(git checkout -b:*),Bash(git switch -c:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git push:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
      # push에 실패해도 세션이 쓴 설계 문서를 잃지 않게 실행 결과물로 보관한다(14일).
      - name: 설계 문서 보관
        if: always() && steps.perm.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-${{ github.event.issue.number }}-${{ github.run_id }}
          path: docs/design/${{ github.event.issue.number }}-*.md
          if-no-files-found: warn
          retention-days: 14
      # 세션이 성공이라고 해도 결과물이 없으면 실패로 처리한다.
      - name: 결과물 확인
        if: steps.perm.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          ok=1
          branch=$(git ls-remote --heads origin "feat/$ISSUE-*" | head -1 | sed 's#.*refs/heads/##')
          if [ -n "$branch" ]; then echo "브랜치: $branch"; else echo "브랜치 없음"; ok=0; fi
          pr=$(gh pr list -R "$REPO" --head "$branch" --state open --json number,isDraft -q '.[0] | "\(.number) draft=\(.isDraft)"')
          if [ -n "$branch" ] && [ -n "$pr" ]; then echo "PR: $pr"; else echo "PR 없음"; ok=0; fi
          n=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate -q '[.[] | select(.body | startswith("인계:"))] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$n" -gt 0 ]; then echo "인계 댓글: $n"; else echo "인계 댓글 없음"; ok=0; fi
          [ "$ok" = 1 ]
      # 공개 저장소라 전체 출력은 끈 채로, 거부된 도구 호출과 턴 수만 로그에 남긴다.
      - name: 거부된 도구와 턴 수
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -c '.[] | select(.type == "result") | {num_turns, subtype, denied: [.permission_denials[]? | {tool_name, input: (.tool_input.command // .tool_input.file_path // "")}]}' "$EXEC_FILE" || true
      - name: 실패하면 blocked 라벨과 원인 댓글
        if: (failure() || cancelled()) && steps.perm.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --add-label blocked
          gh issue comment "$ISSUE" --body "설계 세션이 실패했다. 로그와 보관된 설계 문서는 실행 페이지의 Artifacts에 있다: $RUN_URL . 원인을 확인한 뒤 blocked 라벨을 떼고, ready 라벨을 뗐다가 다시 달면 다시 돈다."