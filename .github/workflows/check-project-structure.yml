name: Check Project Structure

# 읽기 전용 검증은 GitHub 호스팅 러너에서만 돈다. 배포 권한이 있는
# self-hosted 러너에는 pull_request 트리거를 연결하지 않는다.

# paths 필터를 두지 않는다. 생성기가 막으려는 것 중 둘은 "아직 모르는 것"이다
# — tracker/api/web 밖의 새 실행 단위와, 배포 그림에 없는 새 deploy-*.yml.
# 경로 허용목록은 아는 경로만 적을 수 있어서, 정작 그 둘을 들여오는 PR에서
# 검사가 아예 안 도는 구멍이 생긴다. 이 잡은 체크아웃과 스크립트 한 번이라
# 전체 PR에 돌려도 비용이 거의 없다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_project_structure.py --check
