# 설계 119: PR에 /reflect 댓글(권한자)이 달리면 리뷰 지적을 반영하는 세션을 띄운다.
# 설계 "세션 수명 주기" 4번: 구현 세션을 살려 두지 않고, 지적 목록과 인계 댓글을 읽는 새 세션을 띄운다.
# implement-session.yml과 같은 토큰, 권한 확인, 결과물 확인, blocked 처리를 쓴다. 반영은 최대 2회다.
name: reflect-session
on:
  issue_comment:
    types: [created]

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reflect:
    # 이슈가 아니라 PR 댓글이고, 본문이 정확히 /reflect 일 때만.
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/reflect' &&
      !contains(github.event.issue.labels.*.name, 'blocked')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: 댓글 작성자 권한 확인
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          p=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.comment.user.login }}/permission" -q .permission)
          echo "권한: $p"
          if [ "$p" = admin ] || [ "$p" = write ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      # PR head 브랜치와 이슈 번호를 뽑는다. 영역 라벨은 이슈에 있다.
      - name: PR 정보
        id: pr
        if: steps.perm.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr view "$PR" -R "$GH_REPO" --json headRefName -q .headRefName)
          case "$branch" in feat/*) ;; *) echo "feat/ 브랜치가 아니라 반영을 건너뛴다: $branch"; exit 0 ;; esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          issue=$(echo "$branch" | sed -n 's#^feat/\([0-9][0-9]*\)-.*#\1#p')
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
      # 반영 횟수 상한. 이미 반영 댓글이 2개면 더 돌지 않는다(설계 "최대 2회").
      - name: 반영 횟수 확인
        id: count
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate -q '[.[] | select(.body | startswith("반영:"))] | length' | awk '{s+=$1} END {print s+0}')
          echo "반영 댓글 수: $n"
          if [ "$n" -ge 2 ]; then
            echo "반영을 시작하지 않았다. 반영은 최대 2회다(설계 119). 이미 $n회 돌았다. 남은 지적은 사람이 직접 반영하거나 새 이슈로 뗀다." > "$RUNNER_TEMP/c.txt"
            gh pr comment "$PR" -R "$GH_REPO" --body-file "$RUNNER_TEMP/c.txt"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      # 영역 라벨로 역할을 고른다. implement-session과 같은 기준이다.
      - name: 역할 고르기
        id: role
        if: steps.count.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pr.outputs.issue }}
        run: |
          LABELS=$(gh api "repos/$GH_REPO/issues/$ISSUE" -q '[.labels[].name] | join(" ")')
          case " $LABELS " in
            *" web "*)
              echo "agent=web-implementer" >> "$GITHUB_OUTPUT"
              echo "tools=Bash(node:*),Bash(npm:*)" >> "$GITHUB_OUTPUT" ;;
            *" api "*)
              echo "agent=api-implementer" >> "$GITHUB_OUTPUT"
              echo "tools=Bash(./gradlew:*)" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "반영을 시작하지 않았다. 영역 라벨(web, api)이 없어 역할을 고를 수 없다." > "$RUNNER_TEMP/c.txt"
              gh pr comment "$PR" -R "$GH_REPO" --body-file "$RUNNER_TEMP/c.txt" ;;
          esac
      - name: API면 JDK 설치
        if: steps.role.outputs.agent == 'api-implementer'
        uses: actions/setup-java@v4 # check-api.yml과 같은 태그
        with:
          distribution: temurin
          java-version: '17'
      - name: App 토큰 만들기
        id: apptoken
        if: steps.role.outputs.agent != ''
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.WF_APP_ID }}
          private-key: ${{ secrets.WF_APP_PRIVATE_KEY }}
      - if: steps.role.outputs.agent != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.apptoken.outputs.token }}
      - name: 시작 커밋 기록
        id: start
        if: steps.role.outputs.agent != ''
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # 리뷰 지적을 모은다. 미해결 리뷰 스레드, 권한자 PR 댓글, 마지막 인계 댓글.
      - name: 지적 입력 준비
        if: steps.role.outputs.agent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pr.outputs.issue }}
        run: |
          owner=${GH_REPO%/*}; name=${GH_REPO#*/}
          {
            echo "# PR #$PR 리뷰 지적"
            echo
            echo "## 미해결 리뷰 스레드"
            gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:100){nodes{isResolved path line comments(first:20){nodes{author{login} body}}}}}}}' -f o="$owner" -f n="$name" -F p="$PR" \
              | jq -r '.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not) | "### \(.path):\(.line)\n" + (.comments.nodes[] | "- \(.author.login): \(.body)")'
            echo
            echo "## PR 댓글 (OWNER, MEMBER, COLLABORATOR, 봇만)"
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
              | jq -r '.[] | select(.author_association=="OWNER" or .author_association=="MEMBER" or .author_association=="COLLABORATOR" or (.user.login|test("\\[bot\\]$|coderabbitai"))) | "### \(.user.login)\n\(.body)\n"'
            echo
            echo "## 이슈 #$ISSUE 마지막 인계/반영 댓글"
            gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate \
              | jq -r '[.[] | select(.body|startswith("인계:") or startswith("반영:"))] | last | .body // ""'
          } > "$RUNNER_TEMP/findings.md"
      - if: steps.role.outputs.agent != ''
        id: claude
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "*"
          prompt: |
            PR #${{ github.event.issue.number }}, 이슈 #${{ steps.pr.outputs.issue }} 의 리뷰 반영 세션이다.
            .claude/agents/${{ steps.role.outputs.agent }}.md 를 먼저 읽고 그 경로와 규칙을 따른다.
            리뷰 지적은 ${{ runner.temp }}/findings.md 하나만 읽는다. gh로 댓글을 따로 읽지 않는다.
            지금 체크아웃된 브랜치 ${{ steps.pr.outputs.branch }} 에 이어 반영한다. 새 브랜치, 새 PR을 만들지 않는다.
            맞는 지적만 반영한다. 틀렸거나 설계 밖이라 반영하지 않은 지적은 이유를 반영 댓글에 적는다.
            반영한 지적의 리뷰 스레드는 `gh api`로 resolve하지 않는다. 사람이 확인하고 닫는다.
            끝나면 첫 줄이 `반영:` 인 PR 댓글 하나를 남긴다(반영한 것, 반영 안 한 것과 이유, 남은 것).
            셸 명령은 한 번에 하나씩 쓴다. cd, &&, 파이프, heredoc으로 묶지 않는다. 파일은 Write 도구로 쓴다. 댓글은 Write로 파일을 만든 뒤 --body-file로 넘긴다.
            main에는 push할 수 없다(저장소 규칙).
          claude_args: --max-turns 30 --allowedTools "Read,Grep,Glob,Write,Edit,${{ steps.role.outputs.tools }},Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git push:*),Bash(gh pr comment:*)"
      # 새 커밋이 push됐고 반영 댓글이 있어야 성공이다.
      - name: 결과물 확인
        if: steps.role.outputs.agent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          START: ${{ steps.start.outputs.sha }}
        run: |
          ok=1
          head=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
          if [ -n "$head" ] && [ "$head" != "$START" ]; then echo "새 커밋: $head"; else echo "새 커밋 없음"; ok=0; fi
          n=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate -q '[.[] | select(.body | startswith("반영:"))] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$n" -gt 0 ]; then echo "반영 댓글: $n"; else echo "반영 댓글 없음"; ok=0; fi
          [ "$ok" = 1 ]
      - name: 거부된 도구와 턴 수
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -c '.[] | select(.type == "result") | {num_turns, subtype, denied: [.permission_denials[]? | {tool_name, input: (.tool_input.command // .tool_input.file_path // "")}]}' "$EXEC_FILE" || true
      - name: 실패하면 blocked 라벨과 원인 댓글
        if: (failure() || cancelled()) && steps.role.outputs.agent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --add-label blocked
          gh pr comment "$PR" --body "리뷰 반영 세션이 실패했다. 로그: $RUN_URL . 원인을 확인한 뒤 blocked 라벨을 떼고 /reflect 를 다시 달면 다시 돈다(남은 반영 횟수 안에서)."
