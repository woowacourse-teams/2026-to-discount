# 설계 119 2단계: 검사가 끝난 PR에 테스트 수와 남은 리뷰 지적을 댓글 하나로 모은다.
# GITHUB_TOKEN으로 push한 커밋은 다른 워크플로를 깨우지 않으므로 implement-session 종료도 트리거로 쓴다.
name: result-comment
on:
  check_suite:
    types: [completed]
  workflow_call:
    inputs:
      branch:
        type: string
        default: ''

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      pull-requests: write
      contents: read
    steps:
      - name: 결과 모아 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CALLED: ${{ inputs.branch != '' && github.run_id || '' }}
          BRANCH: ${{ inputs.branch || github.event.check_suite.head_branch }}
        run: |
          # feat/ 브랜치의 열린 PR에만 쓴다.
          case "$BRANCH" in feat/*) ;; *) exit 0 ;; esac
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          [ -n "$pr" ] || exit 0
          sha=$(gh pr view "$pr" -R "$REPO" --json headRefOid -q .headRefOid)
          {
            echo "<!-- result-comment -->"
            echo "결과 (${sha:0:7})"
            echo
            echo "| 검사 | 결과 |"
            echo "| --- | --- |"
            gh api "repos/$REPO/commits/$sha/check-runs" --paginate -q '.check_runs[] | "| \(.name) | \(.conclusion // .status) |"'
            # 호출된 검사(check-web / check)는 PR head가 아니라 구현 실행의 job으로 남는다.
            if [ -n "$CALLED" ]; then gh api "repos/$REPO/actions/runs/$CALLED/jobs" --paginate -q '.jobs[] | select(.name | startswith("check-")) | "| \(.name) | \(.conclusion // .status) |"'; fi
            # 테스트 수는 검사 요약에 있을 때만 적는다.
            t=$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate -q '.check_runs[] | select(.output.summary != null) | .output.summary' | grep -iE '[0-9]+ (tests?|passed)' | head -3 || true)
            if [ -n "$t" ]; then echo; echo "테스트: $t"; fi
            owner=${REPO%/*}; name=${REPO#*/}
            open=$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:100){nodes{isResolved}}}}}' -f o="$owner" -f n="$name" -F p="$pr" -q '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved|not)] | length')
            echo
            echo "남은 리뷰 지적: ${open:-0}건"
            # 프리뷰 주소: Vercel이 커밋에 남긴 상태의 target_url(최선 노력, 없으면 생략).
            prev=$(gh api "repos/$REPO/commits/$sha/statuses" --paginate -q 'first(.[] | select(.context|test("[Vv]ercel")) | .target_url) // empty' 2>/dev/null || true)
            if [ -n "$prev" ]; then echo; echo "프리뷰: $prev"; fi
            # 360px 스크린샷: 이 브랜치의 최신 ios-shot 실행(아티팩트 ios-shots).
            shot=$(gh api "repos/$REPO/actions/workflows/ios-shot.yml/runs?branch=$BRANCH&per_page=1" -q '.workflow_runs[0].html_url // empty' 2>/dev/null || true)
            if [ -n "$shot" ]; then echo; echo "360px 스크린샷(아티팩트): $shot"; fi
            # 성능 점수(web-perf)는 병합 뒤 main 배포에서만 돈다. PR 단계에는 없다.
            echo
            echo "성능 점수: 병합 뒤 web-perf가 측정한다(PR 단계에는 없음)."
          } > "$RUNNER_TEMP/result.md"
          id=$(gh api "repos/$REPO/issues/$pr/comments" --paginate -q '[.[] | select(.body | startswith("<!-- result-comment -->"))] | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/result.md" > /dev/null
          else
            gh pr comment "$pr" -R "$REPO" --body-file "$RUNNER_TEMP/result.md"
          fi
