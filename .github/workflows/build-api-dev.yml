name: Deploy API development

on:
  push:
    branches: [dev]
    paths:
      - 'api/**'
      - 'docs/contracts/**'
      - '.github/workflows/build-api-dev.yml'
  workflow_dispatch:
    inputs:
      load_test_preflight:
        description: '개발 부하 테스트 러너 접근 및 권한 점검 (배포 없음)'
        type: boolean
        default: false
      load_test_after:
        description: '개발에 배포된 압축 개선의 30 RPS 5분 3회 측정'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-api-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-test-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.load_test_preflight || inputs.load_test_after) && github.ref == 'refs/heads/dev'
    environment: development
    runs-on: [self-hosted, Linux, ARM64, todiscount-be-dev]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check development host access without changing settings
        env:
          REQUIRE_COMPRESSION: ${{ inputs.load_test_after }}
        run: |
          if [ "$REQUIRE_COMPRESSION" = true ]; then
            python3 api/load-tests/runner-preflight.py --require-compression
          else
            python3 api/load-tests/runner-preflight.py
          fi
      - name: Snapshot server inputs
        if: inputs.load_test_after
        run: |
          mkdir -p "$RUNNER_TEMP/load-server"
          python3 api/load-tests/server-snapshot.py --public-data > "$RUNNER_TEMP/load-server/before.json"
      - uses: actions/upload-artifact@v4
        if: inputs.load_test_after
        with:
          name: load-server-baseline
          path: ${{ runner.temp }}/load-server/before.json
          retention-days: 14

  load-test-monitor:
    needs: load-test-preflight
    if: inputs.load_test_after && github.ref == 'refs/heads/dev'
    environment: development
    runs-on: [self-hosted, Linux, ARM64, todiscount-be-dev]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: load-server-baseline
          path: ${{ runner.temp }}/load-server
      - name: Monitor development server
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 api/load-tests/server-monitor.py "$RUNNER_TEMP/load-server"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-server-observations
          path: ${{ runner.temp }}/load-server/
          retention-days: 14

  load-test-generator:
    needs: load-test-preflight
    if: inputs.load_test_after && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install k6 2.3.0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz
          curl -fsSLO https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-checksums.txt
          awk '$2 == "k6-v2.3.0-linux-amd64.tar.gz" { print; found=1 } END { if (!found) exit 1 }' k6-v2.3.0-checksums.txt | sha256sum -c -
          tar -xzf k6-v2.3.0-linux-amd64.tar.gz
          echo "$RUNNER_TEMP/k6-v2.3.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Record generator environment
        run: |
          mkdir -p "$RUNNER_TEMP/load-client"
          { k6 version; uname -m; nproc; } > "$RUNNER_TEMP/load-client/generator.txt"
      - name: Measure improved read APIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 api/load-tests/cloud-run.py "$RUNNER_TEMP/load-client"
      - name: Summarize all measured stages
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/load-client/runs.ndjson" ]; then
            python3 api/load-tests/summarize.py "$RUNNER_TEMP/load-client"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-client-results
          path: ${{ runner.temp }}/load-client/
          retention-days: 14

  build:
    # 수동 실행도 dev만 허용한다.
    if: github.ref == 'refs/heads/dev' && !inputs.load_test_preflight && !inputs.load_test_after
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test deployment recovery
        run: python3 -m unittest discover -s deploy/dev -p "test_*.py"
      - name: Test
        run: ./gradlew test
      - name: Build executable JAR
        run: ./gradlew bootJar -x test
      - name: Prepare artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/api-dev-artifact
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil
          from pathlib import Path
          jars = [p for p in Path("build/libs").glob("*.jar") if not p.name.endswith("-plain.jar")]
          if len(jars) != 1:
              raise SystemExit(f"Expected exactly one executable JAR, found {len(jars)}")
          target = Path(os.environ["ARTIFACT_DIR"])
          target.mkdir(parents=True, exist_ok=True)
          jar = target / "app.jar"
          shutil.copy2(jars[0], jar)
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          (target / "app.jar.sha256").write_text(f"{digest}  app.jar\n")
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha256": digest,
          }
          (target / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-dev-artifact/
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    environment: development
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, Linux, ARM64, todiscount-be-dev]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check latest dev commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/ref/heads/dev'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request, timeout=15) as response:
              latest = json.load(response)['object']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('current=' + str(latest == os.environ['EXPECTED_SHA']).lower() + '\n')
          PYTHON
      - name: Download artifact
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: api-dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-dev-artifact
      - name: Deploy and verify
        if: steps.latest.outputs.current == 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/api-dev-artifact
        run: sudo /usr/local/sbin/todiscount-deploy-dev "$ARTIFACT_DIR" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Clean downloaded files
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/api-dev-artifact
        run: rm -rf -- "$ARTIFACT_DIR"
