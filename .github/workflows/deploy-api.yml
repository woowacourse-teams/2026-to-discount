name: Build and Deploy API

# 모노레포로 합치면서 api/.github/ 에 있던 것을 루트로 올렸다 — GitHub은
# 루트 .github/workflows 만 읽는다. 코드가 api/ 아래로 내려간 만큼
# working-directory 와 paths 필터를 붙였다.
#
# 2026-08-21: 운영 배포를 nn98/delivery-discount-api로 되돌렸다. web은
# 애초에 nn98/delivery-discount-web에서 Vercel로 나가고 있었는데 api만
# 여기서 나가다 보니, 양쪽 저장소에 서로 다른 "뒤처진 사본"이 하나씩
# 생겼다 — 하루에 두 번 벌어졌고 그중 하나는 문서가 코드보다 앞서
# 있었다(이벤트 18종이라 적힌 저장소의 코드는 16종이었다).
#
# 자동 배포는 이제 nn98 쪽에서만 돈다. 여기는 수동 폴백으로만 남긴다 —
# 두 저장소가 다 push로 배포하면 같은 서버에 경쟁 배포가 된다.

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Build (includes tests)
        run: ./gradlew build

      - name: Deploy jar and restart service
        run: |
          mkdir -p /home/ubuntu/delivery-discount-api/build/libs
          cp build/libs/delivery-discount-api-0.0.1.jar /home/ubuntu/delivery-discount-api/build/libs/delivery-discount-api-0.0.1.jar
          sudo systemctl restart delivery-discount-api.service

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:8088/api/brands -o /dev/null
      - name: 실패를 슬랙 채널로 (설계 26번, 오너 메일만으로는 팀이 못 본다)
        if: failure()
        env:
          SLACK_OPS_TOKEN: ${{ secrets.SLACK_OPS_TOKEN }}
          SLACK_OPS_CHANNEL: ${{ secrets.SLACK_OPS_CHANNEL }}
        run: |
          [ -n "$SLACK_OPS_TOKEN" ] || { echo "SLACK_OPS_TOKEN 없음 - 알림 생략"; exit 0; }
          TEXT="❌ GitHub Actions 실패: ${{ github.workflow }} (${{ github.repository }}, ${GITHUB_SHA::7})"$'\n'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(TEXT="$TEXT" python3 -c 'import json,os;print(json.dumps({"channel":os.environ["SLACK_OPS_CHANNEL"],"text":os.environ["TEXT"]}))')
          curl -s -X POST https://slack.com/api/chat.postMessage -H "Authorization: Bearer $SLACK_OPS_TOKEN" -H "Content-type: application/json; charset=utf-8" --data "$BODY"
