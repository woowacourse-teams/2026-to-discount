# 정본: 병합된 PR 본문의 "### 후속 조치"를 이슈 버퍼 계획으로 쌓는다(2026-11-13: 이슈를 바로 만들지 않는다). mono와 tracker가 같이 부른다.
# 버퍼는 PR의 마커 댓글(`<!-- issue-buffer:v1 -->`)이다. 한 번에 올리는 절차는 tracker docs/public/WORKFLOW.md 7-5와 scripts/issue_buffer.py.
# 규칙의 정본은 mono .claude/skills/pr-body-ko/SKILL.md "후속 조치" 절이다.
# 세션은 계획 파일(JSON)만 쓴다. 댓글은 아래 단계가 단다. 세션에 쓰기 토큰을 주지 않기 위함이다.
name: wf-followups
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN_2:
        required: false
      WF_APP_ID:
        required: true
      WF_APP_PRIVATE_KEY:
        required: true

jobs:
  followups:
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.body, fromJSON('"\n### 후속 조치"')) ||
       contains(github.event.pull_request.body, fromJSON('"\n## 후속 조치"')) ||
       startsWith(github.event.pull_request.body, '### 후속 조치') ||
       startsWith(github.event.pull_request.body, '## 후속 조치'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # 짝 저장소: mono면 tracker, 아니면 mono.
      OTHER_OWNER: ${{ github.repository == 'woowacourse-teams/2026-to-discount' && 'nn98' || 'woowacourse-teams' }}
      OTHER_NAME: ${{ github.repository == 'woowacourse-teams/2026-to-discount' && 'delivery-discount-tracker' || '2026-to-discount' }}
    steps:
      - name: App 토큰(이 저장소)
        id: self
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.WF_APP_ID }}
          private-key: ${{ secrets.WF_APP_PRIVATE_KEY }}
      - name: App 토큰(짝 저장소)
        id: other
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.WF_APP_ID }}
          private-key: ${{ secrets.WF_APP_PRIVATE_KEY }}
          owner: ${{ env.OTHER_OWNER }}
          repositories: ${{ env.OTHER_NAME }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      # 스킬 정본(mono). mono 자신이면 위 체크아웃에 이미 있다.
      - if: github.repository != 'woowacourse-teams/2026-to-discount'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: woowacourse-teams/2026-to-discount
          path: mono
      - name: 입력 준비
        env:
          GH_TOKEN: ${{ github.token }}
          OTHER_TOKEN: ${{ steps.other.outputs.token }}
        run: |
          {
            echo "# 병합된 PR $GH_REPO#$PR: $(gh api "repos/$GH_REPO/pulls/$PR" -q .title)"
            echo
            gh api "repos/$GH_REPO/pulls/$PR" -q '.body // ""'
            echo
            echo "# 이미 쌓았거나 만든 후속 항목 표식"
            gh api "repos/$GH_REPO/issues/$PR/comments" --paginate -q '.[].body' |
              grep -o "followup:$GH_REPO#$PR:[0-9]*" || true
            for r in "$GH_REPO" "$OTHER_OWNER/$OTHER_NAME"; do
              t=$GH_TOKEN; [ "$r" = "$GH_REPO" ] || t=$OTHER_TOKEN
              GH_TOKEN=$t gh issue list -R "$r" --state all --search "followup:$GH_REPO#$PR" --json body \
                -q '.[].body' | grep -o "followup:$GH_REPO#$PR:[0-9]*" || true
            done
          } > "$RUNNER_TEMP/followup-input.md"
          ls mono/.claude/skills/pr-body-ko/SKILL.md 2>/dev/null && echo "skill=mono/.claude/skills/pr-body-ko/SKILL.md" >> "$GITHUB_ENV" \
            || echo "skill=.claude/skills/pr-body-ko/SKILL.md" >> "$GITHUB_ENV"
      # Claude 액션의 자체 설치가 동시 실행 때 429로 실패했다(2026-10-22 tracker #22, mono #143). 간격을 두고 다시 시도해 설치한다.
      - name: Claude Code 설치(재시도)
        id: cc
        run: |
          for i in 1 2 3 4 5; do
            npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 && break
            echo "설치 실패 $i회, $((i * 20))초 뒤 다시"; sleep $((i * 20))
          done
          p=$(command -v claude) || { echo "Claude Code 설치 실패"; exit 1; }
          echo "path=$p" >> "$GITHUB_OUTPUT"
      # 우선 토큰 사용률이 90% 넘으면 다른 토큰(CLAUDE_CODE_OAUTH_TOKEN_2)으로 넘긴다. 두 번째가 없으면 첫 토큰 그대로.
      - name: 토큰 고르기
        id: tok
        env:
          T1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          T2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          CLAUDE: ${{ steps.cc.outputs.path }}
          # 저장소 변수 CLAUDE_TOKEN_SLOT: 1|2 = 우선 토큰(90% 넘으면 다른 쪽), 1only|2only = 고정, 비면 1 우선.
          SLOT: ${{ vars.CLAUDE_TOKEN_SLOT }}
        run: |
          # 사용률 기준 전환(2026-11-03): 우선 토큰(SLOT, 비면 1)의 5시간/주간 사용률을 한 번 물어 90% 미만이면 쓴다.
          # 90% 이상이거나 한도 오류면 다른 토큰도 물어 사용률이 낮은 쪽을 쓴다. 사용률은 stream-json의 rate_limit_info.utilization.
          # SLOT=1only/2only면 시험 없이 그 토큰만 쓴다.
          case "$SLOT" in 1only) echo "which=1" >> "$GITHUB_OUTPUT"; echo "고정: 첫 토큰"; exit 0;; 2only) echo "which=2" >> "$GITHUB_OUTPUT"; echo "고정: 두 번째 토큰"; exit 0;; esac
          pref=1; [ "$SLOT" = 2 ] && [ -n "$T2" ] && pref=2
          use() { [ "$1" = 1 ] && echo "$T1" || echo "$T2"; }
          util() {  # 0~100, 한도 오류면 100, 못 읽으면 0
            out=$(CLAUDE_CODE_OAUTH_TOKEN="$(use "$1")" timeout 90 "$CLAUDE" -p "1" --max-turns 1 --output-format stream-json --verbose 2>&1) && rc=0 || rc=$?
            if [ "$rc" -ne 0 ] && grep -qiE "limit|quota|exceeded|429" <<< "$out"; then echo 100; return; fi
            grep -oE '"utilization":[0-9.]+' <<< "$out" | cut -d: -f2 | sort -g | tail -1 | awk '{printf "%d", $1*100}' | grep . || echo 0
          }
          u=$(util $pref); echo "토큰 $pref 사용률 ${u}%"
          if [ -z "$T2" ] || [ "$u" -lt 90 ]; then echo "which=$pref" >> "$GITHUB_OUTPUT"; exit 0; fi
          alt=$((3 - pref)); ua=$(util $alt); echo "토큰 $alt 사용률 ${ua}%"
          if [ "$ua" -lt "$u" ]; then echo "which=$alt" >> "$GITHUB_OUTPUT"; echo "90% 넘어 토큰 $alt로 전환"; else echo "which=$pref" >> "$GITHUB_OUTPUT"; echo "둘 다 높음, 토큰 $pref 유지"; fi
      - id: claude
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          path_to_claude_code_executable: ${{ steps.cc.outputs.path }}
          claude_code_oauth_token: ${{ steps.tok.outputs.which == '2' && secrets.CLAUDE_CODE_OAUTH_TOKEN_2 || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "2026-to-discount"
          prompt: |
            병합된 PR ${{ github.repository }}#${{ github.event.pull_request.number }} 의 후속 조치를 이슈 버퍼 계획으로 쓰는 세션이다. 이슈를 바로 만들지 않고 계획만 쓴다.
            ${{ env.skill }} 의 "후속 조치" 절과 "0. 문장" 절을 먼저 읽고 따른다.
            입력은 ${{ runner.temp }}/followup-input.md 하나다. 저장소 파일은 고칠 자리를 확인할 때만 읽는다.
            할 일:
            - 후속 조치 항목을 읽는다. 같은 일인 항목은 한 이슈로 묶는다. 이미 표식이 있는 항목 번호는 뺀다.
            - 고칠 곳에 따라 저장소를 고른다. 수집, 원장, 내보내기는 nn98/delivery-discount-tracker(영역 라벨 export 또는 collect). 웹은 woowacourse-teams/2026-to-discount 의 web, 서버는 api.
              워크플로나 하네스처럼 영역이 없으면 라벨을 비운다.
            - 계획의 body는 나중에 이슈 본문이 된다. PR을 열지 않고도 일할 수 있게 쓴다. 절: 개요, 배경(출처 PR의 배경 요약), 할 일, 끝 조건, 참고(출처 PR 번호).
              woowacourse-teams/2026-to-discount 는 공개 저장소다. 서버 경로, 비공개 파일 이름, 비밀값을 쓰지 않는다.
            결과는 Write로 ${{ runner.temp }}/followups.json 하나에 쓴다. 형식:
            [{"repo": "<owner/name>", "title": "<제목>", "labels": ["export"], "items": [1, 2], "body": "<본문 마크다운>"}]
            만들 것이 없으면 [] 를 쓴다. 이슈를 만들거나 댓글을 달지 않는다. 이슈는 사람이 버퍼를 플러시할 때 올라간다.
          claude_args: --max-turns 15 --allowedTools "Read,Grep,Glob,Write"
      # 계획을 이슈로 만들지 않고 PR에 마커 댓글로 쌓는다. 항목 표식으로 다시 돌아도 같은 항목을 또 쌓지 않는다(입력 준비 단계가 표식을 뺀다).
      # 저장소는 이 저장소와 짝 저장소만 받는다. 플러시는 tracker scripts/issue_buffer.py가 한다.
      - name: 버퍼 댓글 쓰기
        env:
          SELF_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/followups.json"
          [ -s "$f" ] || { echo "계획 파일 없음"; exit 1; }
          jq -e 'type == "array"' "$f" > /dev/null
          jq -c --arg o "$OTHER_OWNER/$OTHER_NAME" --arg s "$GH_REPO" '[.[] | select(.repo == $o or .repo == $s)]' "$f" > "$RUNNER_TEMP/ok.json"
          [ "$(jq length "$RUNNER_TEMP/ok.json")" -gt 0 ] || { echo "쌓을 항목 없음"; exit 0; }
          {
            echo "<!-- issue-buffer:v1 -->"
            echo "이슈 버퍼에 쌓은 후속 항목이다. 아직 이슈가 아니다. 사람이 버퍼를 플러시할 때 중복, 충돌을 정리해 올린다."
            for i in $(jq -r 'keys[]' "$RUNNER_TEMP/ok.json"); do
              echo
              jq -r --argjson i "$i" --arg k "$GH_REPO#$PR" '.[$i].items[] | "<!-- followup:\($k):\(.) -->"' "$RUNNER_TEMP/ok.json"
              echo '```json'
              jq ".[$i] + {source: \"$GH_REPO#$PR\"}" "$RUNNER_TEMP/ok.json"
              echo '```'
            done
          } > "$RUNNER_TEMP/c.md"
          GH_TOKEN=$SELF_TOKEN gh pr comment "$PR" -R "$GH_REPO" --body-file "$RUNNER_TEMP/c.md"
      - name: 거부된 도구와 턴 수
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -c '.[] | select(.type == "result") | {num_turns, subtype, denied: [.permission_denials[]? | {tool_name, input: (.tool_input.command // .tool_input.file_path // "")}]}' "$EXEC_FILE" || true
