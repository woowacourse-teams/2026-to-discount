name: Check Web

# 읽기 전용 검증만 한다. 배포 권한이 있는 self-hosted 러너에는
# pull_request 트리거를 연결하지 않는다(check-project-structure.yml과 같은 이유).

on:
  pull_request:
    paths: ['web/**', '.github/workflows/check-web.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/check-web.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # analytics eventId는 PostHog $insert_id로 중복 집계를 막는 근거다.
      # 손으로만 돌리면 회귀를 못 잡는다.
      - run: npm run test:analytics
      - run: npm run build
